<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parent Dashboard — ToyLoop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={darkMode:'class',theme:{extend:{colors:{primary:{50:'#f0fdf4',100:'#dcfce7',200:'#bbf7d0',300:'#86efac',400:'#4ade80',500:'#22c55e',600:'#16a34a',700:'#15803d',800:'#166534',900:'#14532d'},sky:{300:'#7dd3fc',400:'#38bdf8',500:'#0ea5e9',600:'#0284c7'},amber:{300:'#fcd34d',400:'#fbbf24',500:'#f59e0b',600:'#d97706'}}}}}</script>
  <script>if(localStorage.getItem('toyloop_theme')==='dark'){document.documentElement.classList.add('dark')}</script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-50 text-gray-800 antialiased">

  <!-- Mobile Sidebar Overlay -->
  <div id="dash-sidebar-overlay" class="sidebar-overlay hidden sm:hidden"></div>

  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside id="dash-sidebar" class="w-[85vw] sm:w-64 lg:w-72 max-w-[85vw] bg-white border-r border-gray-100 flex-shrink-0 flex flex-col fixed inset-y-0 left-0 z-40 -translate-x-full sm:translate-x-0 sm:sticky sm:top-0 sm:h-screen transition-transform duration-300"></aside>

    <!-- Main -->
    <div class="flex-1 flex flex-col min-w-0 lg:ml-0">
      <!-- Header -->
      <header id="dash-header" class="bg-white border-b border-gray-100 px-4 sm:px-6 lg:px-8 py-4 sticky top-0 z-30"></header>

      <!-- Content -->
      <main class="flex-1 p-4 sm:p-6 lg:p-8">
        <div id="dash-content" class="max-w-6xl mx-auto"></div>
      </main>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
