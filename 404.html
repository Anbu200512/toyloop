<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found — ToyLoop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={darkMode:'class',theme:{extend:{colors:{primary:{50:'#f0fdf4',100:'#dcfce7',200:'#bbf7d0',300:'#86efac',400:'#4ade80',500:'#22c55e',600:'#16a34a',700:'#15803d',800:'#166534',900:'#14532d'},sky:{300:'#7dd3fc',400:'#38bdf8',500:'#0ea5e9',600:'#0284c7'},amber:{300:'#fcd34d',400:'#fbbf24',500:'#f59e0b',600:'#d97706'}}}}}</script>
  <script>if(localStorage.getItem('toyloop_theme')==='dark'){document.documentElement.classList.add('dark')}</script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-50 text-gray-800 antialiased min-h-screen flex items-center justify-center p-4">
  <div class="text-center max-w-md animate-fade-in-up">
    <div class="w-24 h-24 bg-green-100 rounded-3xl flex items-center justify-center mx-auto mb-6">
      <i data-lucide="package-x" class="w-12 h-12 text-green-500"></i>
    </div>
    <h1 class="text-6xl font-bold text-gray-900 mb-4">404</h1>
    <h2 class="text-xl font-bold text-gray-800 mb-2">Page Not Found</h2>
    <p class="text-gray-500 mb-8">The page you're looking for doesn't exist or has been moved.</p>
    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <a href="index.html" class="bg-green-500 hover:bg-green-600 text-white px-8 py-3 rounded-full font-bold transition-all hover:shadow-lg">
        Go Home
      </a>
      <a href="catalog.html" class="bg-white hover:bg-gray-50 text-gray-800 px-8 py-3 rounded-full font-bold transition-all shadow-sm border border-gray-200">
        Browse Catalog
      </a>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
