<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toy Catalog — ToyLoop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={darkMode:'class',theme:{extend:{colors:{primary:{50:'#f0fdf4',100:'#dcfce7',200:'#bbf7d0',300:'#86efac',400:'#4ade80',500:'#22c55e',600:'#16a34a',700:'#15803d',800:'#166534',900:'#14532d'},sky:{300:'#7dd3fc',400:'#38bdf8',500:'#0ea5e9',600:'#0284c7'},amber:{300:'#fcd34d',400:'#fbbf24',500:'#f59e0b',600:'#d97706'}}}}}</script>
  <script>if(localStorage.getItem('toyloop_theme')==='dark'){document.documentElement.classList.add('dark')}</script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-white text-gray-800 antialiased">

  <section class="relative min-h-[55vh] flex flex-col justify-center overflow-hidden bg-white dark:bg-gray-900 pt-28 pb-12">
    <div class="absolute inset-0 bg-cover bg-center bg-no-repeat" style="background-image: url('assets/images/catlog-hero.jpg');"></div>
    <div class="absolute inset-0 bg-gradient-to-b from-black/60 via-black/45 to-black/75"></div>
    <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="text-center mb-10">
        <h1 class="text-4xl sm:text-5xl font-bold text-white mb-4 animate-fade-in-up">Toy Catalog</h1>
        <p class="text-lg text-gray-100 max-w-2xl mx-auto animate-fade-in-up" style="animation-delay:0.1s">Browse our curated collection of premium toys and activity kits for every age group.</p>
      </div>
      <div class="flex flex-col sm:flex-row gap-3 max-w-3xl mx-auto animate-fade-in-up" style="animation-delay:0.2s">
        <div class="flex-1 relative">
          <i data-lucide="search" class="w-5 h-5 text-gray-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
          <input type="text" id="catalog-search" placeholder="Search toys..." class="w-full pl-10 pr-4 py-3.5 border border-gray-200 rounded-xl text-sm bg-white focus:border-green-400 transition-colors" aria-label="Search toys">
        </div>
        <select id="age-filter" class="px-4 py-3.5 border border-gray-200 rounded-xl text-sm bg-white" aria-label="Filter by age">
          <option value="">All Ages</option>
          <option value="1-2 Years">1-2 Years</option>
          <option value="3-4 Years">3-4 Years</option>
          <option value="5-6 Years">5-6 Years</option>
          <option value="7-9 Years">7-9 Years</option>
          <option value="10+ Years">10+ Years</option>
        </select>
        <select id="category-filter" class="px-4 py-3.5 border border-gray-200 rounded-xl text-sm bg-white" aria-label="Filter by category">
          <option value="">All Categories</option>
          <option value="educational">Educational</option>
          <option value="pretend">Pretend Play</option>
          <option value="outdoor">Outdoor</option>
          <option value="building">Building Sets</option>
          <option value="activity">Activity Kits</option>
        </select>
      </div>
    </div>
  </section>

  <section class="py-8 pb-20">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div id="catalog-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
    </div>
  </section>

  <button id="back-to-top" class="back-to-top bg-green-500 hover:bg-green-600 text-white w-12 h-12 rounded-full shadow-lg flex items-center justify-center" aria-label="Back to top"><i data-lucide="chevron-up" class="w-6 h-6"></i></button>

  <script src="js/main.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/footer.js"></script>
  <script>document.addEventListener('DOMContentLoaded', initCatalogFilters);</script>
</body>
</html>
